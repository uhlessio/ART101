<html lang="en">

<head>

<body>
    <div id="top">
        <style>
            body {
                background-image: url("envimage/ssbub-rinstar.jpg");

                background-size: cover;
            }
        </style>
        <img id="gunship" src="../images/gunship.jpg">
    </div>
    <div id="text">
        <h1> Brinstar</h1>

        <h3>This stage is an underground cavern on Planet Zebes, where the Metroid Series takes place.</br> Be careful

    <button id="needy-button3">Stage Info</button>

    <div id="main">
        <img id="jiggly" src="../images/jigglypuff.jpg">
        <img id="pokeball" src="../images/pokeball.jpg">

    </div>
